<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="JARVIS">
<meta name="theme-color" content="#04080f">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<title>J.A.R.V.I.S</title>
<style>
:root {
  --bg: #04080f; --panel: rgba(10,24,42,.78); --line: rgba(56,189,248,.18); --line2: rgba(56,189,248,.38);
  --cyan: #22d3ee; --cyan2: #67e8f9; --blue: #3b82f6; --text: #dbeafe; --muted: #7d93b2;
  --warn: #fbbf24; --green: #34d399; --red: #f43f5e;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --sans: -apple-system, system-ui, "Segoe UI", Tahoma, sans-serif;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; margin: 0; }
body {
  background: radial-gradient(900px 600px at 50% 18%, #0b2340 0%, #071222 45%, var(--bg) 100%) fixed;
  color: var(--text); font-family: var(--sans);
  display: flex; flex-direction: column; height: 100dvh; overflow: hidden;
}
header {
  display: flex; align-items: center; justify-content: space-between;
  padding: calc(env(safe-area-inset-top) + 10px) 16px 10px; border-bottom: 1px solid var(--line);
}
.brand { font-family: var(--mono); letter-spacing: .3em; font-weight: 700; color: var(--cyan2); font-size: 14px; display: flex; gap: 10px; align-items: center; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--cyan); box-shadow: 0 0 10px var(--cyan); }
.icon-btn { width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--line2); background: transparent; color: var(--cyan2); display: grid; place-items: center; font-size: 18px; }

.core { display: flex; align-items: center; gap: 14px; padding: 12px 16px 6px; }
.orb-wrap { position: relative; width: 92px; height: 92px; flex: none; }
#orb { width: 100%; height: 100%; }
.ring { position: absolute; inset: -6px; border-radius: 50%; border: 1px solid transparent; border-top-color: var(--cyan); animation: spin 8s linear infinite; }
body.listening .ring { border-top-color: var(--green); animation-duration: 2s; }
body.thinking .ring { border-top-color: var(--warn); animation-duration: 1s; }
body.speaking .ring { border-top-color: var(--cyan2); animation-duration: 3s; }
.status { min-width: 0; }
.state { font-family: var(--mono); font-size: 11px; letter-spacing: .3em; color: var(--muted); }
body.listening .state { color: var(--green); } body.thinking .state { color: var(--warn); } body.speaking .state { color: var(--cyan); }
.heard { margin-top: 6px; font-size: 15px; line-height: 1.4; color: #fff; unicode-bidi: plaintext; max-height: 64px; overflow: hidden; }

.log { flex: 1; overflow-y: auto; padding: 8px 14px 14px; display: flex; flex-direction: column; gap: 10px; -webkit-overflow-scrolling: touch; }
.msg { max-width: 88%; padding: 10px 12px; border-radius: 14px; font-size: 15px; line-height: 1.45; unicode-bidi: plaintext; white-space: pre-wrap; word-wrap: break-word; }
.msg .t { display: block; font-family: var(--mono); font-size: 10px; letter-spacing: .1em; color: var(--muted); margin-bottom: 3px; }
.msg.user { align-self: flex-end; background: rgba(59,130,246,.2); border: 1px solid rgba(59,130,246,.4); }
.msg.bot { align-self: flex-start; background: rgba(34,211,238,.09); border: 1px solid var(--line); }
.msg.sys { align-self: center; font-family: var(--mono); font-size: 11px; color: var(--green); padding: 2px; text-align: center; }
.msg img { display: block; max-width: 100%; max-height: 220px; border-radius: 10px; margin-top: 6px; }
.link-btn { display: inline-block; margin-top: 8px; padding: 8px 14px; border-radius: 10px; background: linear-gradient(90deg, var(--blue), var(--cyan)); color: #00121c; font-weight: 700; text-decoration: none; font-size: 14px; }

.attach { display: none; align-items: center; gap: 10px; margin: 0 14px 6px; padding: 6px; border: 1px solid var(--line2); border-radius: 12px; background: var(--panel); }
.attach.on { display: flex; }
.attach img { width: 44px; height: 44px; object-fit: cover; border-radius: 8px; }
.attach span { flex: 1; font-size: 13px; color: var(--muted); }
.attach button { background: none; border: none; color: var(--muted); font-size: 18px; }

.composer { display: flex; gap: 8px; align-items: center; padding: 10px 12px calc(env(safe-area-inset-bottom) + 10px); border-top: 1px solid var(--line); background: rgba(4,8,15,.85); }
.composer input { flex: 1; min-width: 0; }
input, select { width: 100%; font: inherit; font-size: 16px; color: var(--text); background: rgba(2,6,12,.65); border: 1px solid var(--line2); border-radius: 12px; padding: 11px 12px; outline: none; unicode-bidi: plaintext; }
input:focus, select:focus { border-color: var(--cyan); }
.round { flex: none; width: 46px; height: 46px; border-radius: 50%; border: 1px solid var(--line2); background: rgba(34,211,238,.1); color: var(--cyan2); display: grid; place-items: center; font-size: 19px; }
.round.mic { background: radial-gradient(circle at 50% 35%, #0e3a5c, #071a2c); }
body.listening .round.mic { background: radial-gradient(circle at 50% 35%, #0f766e, #064e3b); color: #fff; box-shadow: 0 0 20px rgba(52,211,153,.5); }

.sheet { position: fixed; inset: 0; background: rgba(2,6,12,.72); display: flex; align-items: flex-end; z-index: 10; }
.sheet[hidden] { display: none; }
.sheet-box { width: 100%; max-height: 90dvh; overflow-y: auto; background: #081627; border-top: 1px solid var(--line2); border-radius: 20px 20px 0 0; padding: 18px 18px calc(env(safe-area-inset-bottom) + 18px); display: grid; gap: 12px; }
.sheet-box h2 { margin: 0; font-family: var(--mono); letter-spacing: .15em; color: var(--cyan2); font-weight: 500; font-size: 17px; display: flex; justify-content: space-between; align-items: center; }
.sheet-box label { display: grid; gap: 6px; font-size: 13px; color: var(--muted); }
.help { font-size: 12px; color: var(--muted); line-height: 1.5; }
.primary { background: linear-gradient(90deg, var(--blue), var(--cyan)); color: #00121c; border: none; padding: 13px; border-radius: 12px; font-weight: 700; font-size: 16px; }
details summary { color: var(--muted); font-size: 13px; }
.toast { position: fixed; left: 50%; top: calc(env(safe-area-inset-top) + 64px); transform: translateX(-50%); background: #0b2a3f; border: 1px solid var(--cyan); color: #fff; padding: 10px 16px; border-radius: 12px; font-size: 14px; z-index: 20; max-width: 90vw; text-align: center; unicode-bidi: plaintext; }
.toast[hidden] { display: none; }
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<header>
  <div class="brand"><span class="dot"></span>J.A.R.V.I.S</div>
  <button id="gear" class="icon-btn" aria-label="Settings">⚙</button>
</header>

<section class="core">
  <div class="orb-wrap"><canvas id="orb"></canvas><div class="ring"></div></div>
  <div class="status">
    <div id="state" class="state">STANDBY</div>
    <div id="heard" class="heard"></div>
  </div>
</section>

<div id="log" class="log"></div>

<div id="attach" class="attach">
  <img id="attachImg" alt="">
  <span id="attachText">Screenshot attached</span>
  <button id="attachX" aria-label="Remove">✕</button>
</div>

<form id="composer" class="composer">
  <button type="button" id="shotBtn" class="round" aria-label="Add screenshot">📷</button>
  <input id="input" type="text" autocomplete="off" placeholder="Message JARVIS…">
  <button type="button" id="micBtn" class="round mic" aria-label="Talk">🎙</button>
  <button type="submit" class="round" aria-label="Send">➤</button>
</form>
<input id="file" type="file" accept="image/*" hidden>

<div id="toast" class="toast" hidden></div>

<div id="sheet" class="sheet" hidden>
  <div class="sheet-box">
    <h2>Settings <button id="closeSheet" class="icon-btn" aria-label="Close">✕</button></h2>
    <label>Your name <input id="sName" type="text"></label>
    <label>Language
      <select id="sLang">
        <option value="fa-IR">فارسی / دری</option>
        <option value="en-US">English</option>
        <option value="ur-PK">اردو</option>
        <option value="hi-IN">हिन्दी</option>
        <option value="ar-SA">العربية</option>
      </select>
    </label>
    <label>Voice
      <select id="sVoice">
        <option value="auto">Automatic (male natural voice when needed)</option>
        <option value="natural">Always natural Google voice (male)</option>
        <option value="device">Phone voice only</option>
        <option value="off">No voice (text only)</option>
      </select>
    </label>
    <label>Gemini API key
      <input id="sKey" type="password" placeholder="Paste your API key here" autocomplete="off">
    </label>
    <div class="help">Use the same free key as on your computer: <b>aistudio.google.com/apikey</b>. It is saved only on this phone.</div>
    <details>
      <summary>Advanced</summary>
      <label style="margin-top:10px">Model <input id="sModel" type="text"></label>
    </details>
    <button id="save" class="primary">Save</button>
  </div>
</div>

<script>
(() => {
  "use strict";
  const $ = (id) => document.getElementById(id);
  const API = "https://generativelanguage.googleapis.com/v1beta";
  const CHAT_MODELS = ["gemini-flash-lite-latest", "gemini-3.5-flash-lite", "gemini-flash-latest"];
  const TTS_MODELS = ["gemini-3.8-flash-tts", "gemini-2.5-flash-preview-tts", "gemini-3.1-flash-tts-preview"];
  const TTS_VOICE = "Charon"; // male

  // ---------------------------------------------------------- settings (saved on this phone only)
  const KEY = "jarvis_mobile_v1";
  const defaults = { name: "", lang: "fa-IR", voice: "auto", key: "", model: CHAT_MODELS[0] };
  let cfg = { ...defaults };
  try { cfg = { ...defaults, ...JSON.parse(localStorage.getItem(KEY) || "{}") }; } catch (e) {}
  function saveCfg() { try { localStorage.setItem(KEY, JSON.stringify(cfg)); } catch (e) {} }

  // ---------------------------------------------------------- ui helpers
  let state = "idle", busy = false, level = 0;
  function setState(s) {
    state = s;
    document.body.classList.remove("listening", "thinking", "speaking");
    if (s !== "idle") document.body.classList.add(s);
    $("state").textContent = { idle: "STANDBY", listening: "LISTENING", thinking: "THINKING", speaking: "SPEAKING" }[s];
  }
  const now = () => new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  function addMsg(kind, text, img) {
    const d = document.createElement("div");
    d.className = "msg " + kind;
    if (kind !== "sys") {
      const t = document.createElement("span");
      t.className = "t";
      t.textContent = (kind === "user" ? (cfg.name || "YOU").toUpperCase() : "JARVIS") + " · " + now();
      d.appendChild(t);
    }
    if (text) d.appendChild(document.createTextNode(text));
    if (img) { const i = document.createElement("img"); i.src = img; d.appendChild(i); }
    $("log").appendChild(d);
    $("log").scrollTop = $("log").scrollHeight;
    return d;
  }
  function toast(text, ms = 4000) {
    const el = $("toast"); el.textContent = text; el.hidden = false;
    clearTimeout(toast.t); toast.t = setTimeout(() => (el.hidden = true), ms);
  }
  const isRtl = (s) => /[؀-ۿ]/.test(s);
  const fa = () => /^(fa|ur|ar)/.test(cfg.lang);

  // ---------------------------------------------------------- AI
  function systemPrompt() {
    const d = new Date();
    return "You are JARVIS, a smart, friendly personal assistant on " + (cfg.name || "the user") + "'s iPhone. " +
      "Current local time: " + d.toString().slice(0, 21) + ". " +
      "Always reply in the SAME language the user uses (Persian/Dari, English, Urdu, Pashto, Hindi...). " +
      "Keep answers short and spoken-style: 1-3 sentences, no markdown, no emojis. " +
      "If the user sends a SCREENSHOT, act as a patient teacher: look at it, say what you see in one short sentence, " +
      "and tell them the ONE next step to do (what to tap or type and where it is). The user does every tap themselves. " +
      "If they did the previous step correctly, praise them briefly first. " +
      "If opening a website or app link would help (YouTube, Google search, maps...), add a link. " +
      'Reply with ONLY a JSON object: {"say": "text to say", "link": {"label": "short button text", "url": "https://..."} } ' +
      "(omit link if not needed).";
  }

  const history = [];
  async function chat(text, image) {
    const userContent = image
      ? [{ type: "text", text }, { type: "image_url", image_url: { url: image } }]
      : text;
    const messages = [{ role: "system", content: systemPrompt() }, ...history.slice(-12), { role: "user", content: userContent }];
    const models = [...new Set([cfg.model || CHAT_MODELS[0], ...CHAT_MODELS])];
    let lastErr = "";
    for (const m of models) {
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), 25000);
      try {
        const r = await fetch(API + "/openai/chat/completions", {
          method: "POST", signal: ctrl.signal,
          headers: { "Content-Type": "application/json", "Authorization": "Bearer " + cfg.key },
          body: JSON.stringify({ model: m, messages, temperature: 0.4 }),
        });
        let data = null; try { data = await r.json(); } catch (e) {}
        if (Array.isArray(data)) data = data[0];
        if (r.ok) {
          history.push({ role: "user", content: image ? text + " [screenshot]" : text });
          const content = (data && data.choices && data.choices[0].message.content) || "";
          return parse(content);
        }
        const detail = (data && data.error && data.error.message) || "";
        if (r.status === 400 && /api key/i.test(detail)) throw new Error("KEY");
        if (r.status === 401 || r.status === 403) throw new Error("KEY");
        lastErr = r.status + " " + detail.slice(0, 80);
      } catch (e) {
        if (e.message === "KEY") throw e;
        lastErr = e.name === "AbortError" ? "timeout" : "network";
      } finally { clearTimeout(timer); }
    }
    throw new Error(lastErr || "failed");
  }
  function parse(content) {
    const c = content.replace(/```(?:json)?/g, "").trim();
    const m = c.match(/\{[\s\S]*\}/);
    if (m) {
      try {
        const o = JSON.parse(m[0]);
        const link = o.link && typeof o.link.url === "string" && /^https:\/\//.test(o.link.url) ? o.link : null;
        return { say: String(o.say || "").trim(), link };
      } catch (e) {}
    }
    return { say: c, link: null };
  }

  // ---------------------------------------------------------- voice out
  let audioCtx = null;
  function unlockAudio() {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === "suspended") audioCtx.resume();
      if ("speechSynthesis" in window && !unlockAudio.done) {
        const u = new SpeechSynthesisUtterance(" "); u.volume = 0; speechSynthesis.speak(u); unlockAudio.done = true;
      }
    } catch (e) {}
  }
  function deviceVoice(text) {
    if (!("speechSynthesis" in window)) return null;
    const voices = speechSynthesis.getVoices();
    const want = isRtl(text) ? (cfg.lang.startsWith("ur") ? ["ur", "fa", "ar"] : cfg.lang.startsWith("ar") ? ["ar"] : ["fa", "ur"]) : ["en"];
    const MALE = /Dariush|Farid|Maged|Tarik|Daniel|Aaron|Arthur|Fred|Gordon|Rishi|Reed|Rocko|Eddy|Male/i;
    for (const l of want) {
      const list = voices.filter((v) => v.lang.toLowerCase().startsWith(l));
      if (list.length) return list.find((v) => MALE.test(v.name)) || list[0];
    }
    return null;
  }
  function speakDevice(text, voice) {
    return new Promise((done) => {
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      if (voice) { u.voice = voice; u.lang = voice.lang; }
      u.onend = u.onerror = () => done();
      speechSynthesis.speak(u);
      setTimeout(done, 4000 + text.length * 120);
    });
  }
  async function speakNatural(text) {
    if (!audioCtx) return false;
    for (const m of TTS_MODELS) {
      try {
        const r = await fetch(API + "/models/" + m + ":generateContent?key=" + encodeURIComponent(cfg.key), {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            contents: [{ parts: [{ text }] }],
            generationConfig: { responseModalities: ["AUDIO"], speechConfig: { voiceConfig: { prebuiltVoiceConfig: { voiceName: TTS_VOICE } } } },
          }),
        });
        if (!r.ok) continue;
        const j = await r.json();
        const part = j.candidates && j.candidates[0].content.parts.find((p) => p.inlineData);
        if (!part) continue;
        const rate = parseInt((/rate=(\d+)/.exec(part.inlineData.mimeType || "") || [0, 24000])[1], 10);
        const bin = atob(part.inlineData.data);
        const n = bin.length >> 1;
        const buf = audioCtx.createBuffer(1, n, rate);
        const ch = buf.getChannelData(0);
        for (let i = 0; i < n; i++) {
          let v = bin.charCodeAt(i * 2) | (bin.charCodeAt(i * 2 + 1) << 8);
          if (v >= 32768) v -= 65536;
          ch[i] = v / 32768;
        }
        await new Promise((done) => {
          const src = audioCtx.createBufferSource();
          src.buffer = buf; src.connect(audioCtx.destination);
          src.onended = done; src.start();
        });
        return true;
      } catch (e) { /* try next model */ }
    }
    return false;
  }
  let warnedNoVoice = false;
  async function speak(text) {
    if (!text || cfg.voice === "off") return;
    setState("speaking");
    try {
      const dv = deviceVoice(text);
      const wantNatural = cfg.voice === "natural" || (cfg.voice === "auto" && (isRtl(text) || !dv));
      if (cfg.voice !== "device" && wantNatural && await speakNatural(text)) return;
      if (dv || !isRtl(text)) return await speakDevice(text, dv);
      if (!warnedNoVoice) { warnedNoVoice = true; addMsg("sys", fa() ? "الان صدای فارسی در دسترس نیست، فقط متن نشان داده می‌شود." : "No voice available right now — showing text only."); }
    } finally { setState("idle"); }
  }

  // ---------------------------------------------------------- screenshot
  let pendingImage = null;
  $("shotBtn").addEventListener("click", () => { unlockAudio(); $("file").click(); });
  $("file").addEventListener("change", async () => {
    const f = $("file").files[0];
    $("file").value = "";
    if (!f) return;
    pendingImage = await shrink(f);
    $("attachImg").src = pendingImage;
    $("attachText").textContent = fa() ? "عکس صفحه آماده است. سؤالت را بنویس یا بفرست." : "Screenshot ready. Ask, or just send.";
    $("attach").classList.add("on");
  });
  $("attachX").addEventListener("click", () => { pendingImage = null; $("attach").classList.remove("on"); });
  function shrink(file) {
    return new Promise((ok, bad) => {
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => {
        const s = Math.min(1, 1280 / Math.max(img.width, img.height));
        const c = document.createElement("canvas");
        c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        ok(c.toDataURL("image/jpeg", 0.7));
      };
      img.onerror = bad;
      img.src = url;
    });
  }

  // ---------------------------------------------------------- send
  async function send(text) {
    text = (text || "").trim();
    const image = pendingImage;
    if ((!text && !image) || busy) return;
    if (!cfg.key) { openSheet(); toast(fa() ? "اول کلید را در تنظیمات بگذار." : "Add your API key first."); return; }
    if (!text) text = fa() ? "این صفحه‌ی من است. قدم بعدی چیست؟" : "This is my screen. What should I do next?";
    busy = true;
    pendingImage = null; $("attach").classList.remove("on");
    addMsg("user", text, image);
    $("heard").textContent = text;
    setState("thinking");
    try {
      const res = await chat(text, image);
      history.push({ role: "assistant", content: res.say });
      while (history.length > 24) history.shift();
      const el = addMsg("bot", res.say);
      if (res.link) {
        const a = document.createElement("a");
        a.className = "link-btn"; a.href = res.link.url; a.target = "_blank"; a.rel = "noopener";
        a.textContent = "↗ " + (res.link.label || "Open");
        el.appendChild(document.createElement("br")); el.appendChild(a);
      }
      $("heard").textContent = res.say;
      await speak(res.say);
    } catch (e) {
      const msg = e.message === "KEY"
        ? (fa() ? "کلید هوش مصنوعی درست نیست. در تنظیمات دوباره بگذار." : "Your AI key is not working. Please check it in Settings.")
        : (fa() ? "الان به هوش مصنوعی وصل نمی‌شوم. دوباره امتحان کن." : "I can't reach the AI right now. Please try again.");
      addMsg("bot", msg);
      $("heard").textContent = msg;
    } finally {
      busy = false;
      setState("idle");
    }
  }
  $("composer").addEventListener("submit", (e) => {
    e.preventDefault(); unlockAudio();
    const v = $("input").value; $("input").value = "";
    $("input").blur();
    send(v);
  });

  // ---------------------------------------------------------- voice in
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  let rec = null, recognizing = false;
  $("micBtn").addEventListener("click", () => {
    unlockAudio();
    if (state === "speaking") { try { speechSynthesis.cancel(); } catch (e) {} return; }
    if (!SR) {
      toast(fa() ? "روی این گوشی از میکروفونِ کیبورد استفاده کن: در خانه‌ی نوشتن بزن و دکمه‌ی میکروفون کیبورد را بزن." : "Use the microphone key on your keyboard to dictate.", 6000);
      $("input").focus();
      return;
    }
    if (recognizing) { rec.stop(); return; }
    rec = new SR();
    rec.lang = cfg.lang; rec.interimResults = true; rec.continuous = false;
    let finalText = "";
    rec.onstart = () => { recognizing = true; setState("listening"); };
    rec.onresult = (ev) => {
      let interim = "";
      for (let i = ev.resultIndex; i < ev.results.length; i++) {
        if (ev.results[i].isFinal) finalText += ev.results[i][0].transcript; else interim += ev.results[i][0].transcript;
      }
      $("heard").textContent = finalText || interim;
    };
    rec.onerror = (ev) => {
      if (ev.error === "not-allowed" || ev.error === "service-not-allowed")
        toast(fa() ? "اجازه‌ی میکروفون داده نشد. از میکروفونِ کیبورد استفاده کن." : "Microphone not allowed. Use the keyboard microphone instead.", 6000);
    };
    rec.onend = () => {
      recognizing = false;
      if (state === "listening") setState("idle");
      if (finalText.trim()) send(finalText);
    };
    try { rec.start(); } catch (e) { toast("Mic error"); }
  });

  // ---------------------------------------------------------- settings sheet
  function openSheet() {
    $("sName").value = cfg.name; $("sLang").value = cfg.lang; $("sVoice").value = cfg.voice;
    $("sModel").value = cfg.model; $("sKey").value = "";
    $("sKey").placeholder = cfg.key ? "Saved ••••" + cfg.key.slice(-4) + " (leave empty to keep)" : "Paste your API key here";
    $("sheet").hidden = false;
  }
  $("gear").addEventListener("click", openSheet);
  $("closeSheet").addEventListener("click", () => ($("sheet").hidden = true));
  $("save").addEventListener("click", () => {
    unlockAudio();
    cfg.name = $("sName").value.trim(); cfg.lang = $("sLang").value; cfg.voice = $("sVoice").value;
    cfg.model = $("sModel").value.trim() || CHAT_MODELS[0];
    if ($("sKey").value.trim()) cfg.key = $("sKey").value.trim();
    saveCfg();
    $("sheet").hidden = true;
    toast(fa() ? "ذخیره شد ✓" : "Saved ✓", 2000);
  });

  // ---------------------------------------------------------- orb
  const cv = $("orb"), cx2 = cv.getContext("2d");
  const pts = [];
  for (let i = 0, N = 260; i < N; i++) {
    const y = 1 - (i / (N - 1)) * 2, r = Math.sqrt(1 - y * y), th = i * Math.PI * (3 - Math.sqrt(5));
    pts.push([Math.cos(th) * r, y, Math.sin(th) * r, Math.random()]);
  }
  function size() { const d = window.devicePixelRatio || 1; cv.width = cv.clientWidth * d; cv.height = cv.clientHeight * d; }
  size(); window.addEventListener("resize", size);
  let rot = 0;
  (function draw(ts) {
    const target = state === "speaking" ? 0.35 + Math.random() * 0.4 : state === "listening" ? 0.25 : 0;
    level += (target - level) * 0.15;
    rot += { idle: 0.004, listening: 0.01, thinking: 0.03, speaking: 0.012 }[state];
    const w = cv.width, h = cv.height, cx = w / 2, cy = h / 2, R = Math.min(w, h) * 0.36 * (1 + level * 0.15);
    const col = { idle: "34,211,238", listening: "52,211,153", thinking: "251,191,36", speaking: "103,232,249" }[state];
    cx2.clearRect(0, 0, w, h);
    const g = cx2.createRadialGradient(cx, cy, 0, cx, cy, R * 1.3);
    g.addColorStop(0, `rgba(${col},${0.22 + level * 0.3})`); g.addColorStop(1, "rgba(0,0,0,0)");
    cx2.fillStyle = g; cx2.beginPath(); cx2.arc(cx, cy, R * 1.3, 0, 7); cx2.fill();
    const ca = Math.cos(rot), sa = Math.sin(rot), d = window.devicePixelRatio || 1;
    for (const p of pts) {
      const x = p[0] * ca - p[2] * sa, z = p[0] * sa + p[2] * ca;
      const wob = 1 + level * 0.2 * Math.sin((ts || 0) / 160 + p[3] * 12);
      const s = (z + 2) / 3;
      cx2.fillStyle = `rgba(${col},${0.2 + s * 0.75})`;
      const sz = (0.7 + s * 1.4) * d;
      cx2.fillRect(cx + x * R * wob - sz / 2, cy + p[1] * R * wob - sz / 2, sz, sz);
    }
    requestAnimationFrame(draw);
  })();

  // ---------------------------------------------------------- start
  const h = new Date().getHours();
  const hello = fa()
    ? (h < 12 ? "صبح بخیر" : h < 18 ? "روز بخیر" : "شب بخیر") + (cfg.name ? "، " + cfg.name : "") + ". جارویس آماده است."
    : (h < 12 ? "Good morning" : h < 18 ? "Good afternoon" : "Good evening") + (cfg.name ? ", " + cfg.name : "") + ". JARVIS is online.";
  addMsg("bot", hello + (cfg.key ? "" : fa() ? " اول از تنظیمات (⚙) کلید را بگذار." : " Add your API key in Settings (⚙) first."));
  addMsg("sys", fa() ? "📷 = عکس صفحه بفرست تا قدم بعدی را بگویم" : "📷 = send a screenshot and I'll tell you the next step");
  if (!cfg.key) setTimeout(openSheet, 800);
})();
</script>
